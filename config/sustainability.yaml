    francesouth:         "10YFR-RTE------C"    # France
    germanywestcentral:  "10Y1001A1001A83F"    # Germany
    uksouth:             "10YGB----------A"    # UK → prefer UK Carbon API
    ukwest:              "10YGB----------A"    # UK → prefer UK Carbon API
    swedencentral:       "10YSE-1--------K"    # Sweden
    switzerlandnorth:    "10YCH-SWISSGRID-E"  # Switzerland
    switzerlandwest:     "10YCH-SWISSGRID-E"  # Switzerland
