apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudbroker.fullname" . }}
  labels:
    {{- include "cloudbroker.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  HOST: {{ .Values.config.host | quote }}
  PORT: {{ .Values.config.port | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.config.rateLimitPerMinute | quote }}
  SECRETS_DIR: {{ .Values.secretsDir | quote }}
