coder:
  env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
    # OIDC (Google) - only applied when coder-values-oidc.yaml is merged (CODER_OIDC_CLIENT_ID set)
    - name: CODER_ACCESS_URL
      value: "http://localhost:30180"
  image:
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    httpNodePort: 30180
