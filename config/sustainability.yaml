  gcp:
    europe-west1:      "10YBE----------2"   # Belgium
    europe-west2:      "10YGB----------A"   # UK → prefer UK Carbon API
    europe-west3:      "10Y1001A1001A83F"   # Germany
    europe-west4:      "10YNL----------L"   # Netherlands
    europe-west6:      "10YCH-SWISSGRID-E"  # Switzerland
    europe-west8:      "10YIT-GRTN-----B"   # Italy (Milan)
    europe-west9:      "10YFR-RTE------C"   # France
    europe-west10:     "10Y1001A1001A83F"   # Germany (Berlin)
    europe-west12:     "10YIT-GRTN-----B"   # Italy (Turin)
    europe-north1:     "10YFI-1--------U"   # Finland
    europe-southwest1: "10YES-REE------0"   # Spain (Madrid)
