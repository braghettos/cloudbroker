# Bitwarden Secrets Manager ClusterSecretStore for External Secrets Operator
#
# Prerequisites:
#   1. External Secrets Operator installed
#   2. Bitwarden Secrets Manager account (https://bitwarden.com/products/secrets-manager/)
#   3. Machine account token created in Bitwarden SM
#   4. Token stored in a Kubernetes Secret:
#      kubectl create secret generic bitwarden-credentials \
#        -n external-secrets \
#        --from-literal=token=<your-machine-account-token>
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: bitwarden-secret-store
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: https://vault.bitwarden.com
      auth:
        secretRef:
          credentials:
            name: bitwarden-credentials
            namespace: external-secrets
            key: token
      organizationID: <your-bitwarden-org-id>
      projectID: <your-bitwarden-project-id>
