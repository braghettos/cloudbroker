apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbroker-ingress
  namespace: cloudbroker
  labels:
    app.kubernetes.io/name: cloudbroker
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: cloudbroker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudbroker-service
                port:
                  number: 8000
