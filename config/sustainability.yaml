# ── Manual overrides ──────────────────────────────────────────────────────────
# Use for:
#   - Providers with verifiable 100% renewable commitments (PPAs/RECs)
#   - Regions not reachable by any API
#   - Corrections when real-time data is inaccurate
#
# renewable_energy_pct: 0.0–1.0  (1.0 = 100%)
# carbon_intensity_g_co2_kwh: gCO2eq/kWh (market-based, not grid-average)
#
# Notes:
#   - AWS has committed to 100% renewable energy by 2025 (achieved in some regions).
#   - GCP claims 100% renewable matching via RECs but not 24/7 carbon-free.
#   - Azure committed to 100% renewable by 2025.
#   - Hetzner uses renewable energy for its Finnish DC.
#   These are MARKET-BASED values (with RECs), not location-based grid intensity.
#   Leave empty to use location-based grid data (more conservative/accurate).
region_overrides: {}
