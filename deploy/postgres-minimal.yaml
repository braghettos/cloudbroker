# Minimal PostgreSQL for Kind (ephemeral - no PVC to avoid disk space issues)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbroker-db
  namespace: cloudbroker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbroker-db
  template:
    metadata:
      labels:
        app: cloudbroker-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: cloudbroker
            - name: POSTGRES_PASSWORD
              value: cloudbroker
            - name: POSTGRES_DB
              value: cloudbroker
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbroker-db-postgresql
  namespace: cloudbroker
spec:
  selector:
    app: cloudbroker-db
  ports:
    - port: 5432
      targetPort: 5432
