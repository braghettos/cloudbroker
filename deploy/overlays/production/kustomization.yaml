apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudbroker

resources:
  - ../../
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

patches:
  - target:
      kind: Service
      name: cloudbroker-service
    patch: |
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort

  - target:
      kind: Deployment
      name: cloudbroker-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: ghcr.io/braghettos/cloudbroker
    newTag: latest
