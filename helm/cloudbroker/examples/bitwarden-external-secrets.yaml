# Bitwarden Secrets Manager + External Secrets Operator
#
# Prerequisites:
#   1. External Secrets Operator (ESO) installed: https://external-secrets.io
#   2. Bitwarden provider configured (see bitwarden-secret-store.yaml)
#   3. Secrets created in Bitwarden Secrets Manager with the IDs below
#
# These ExternalSecret CRDs create Kubernetes Secrets that CloudBroker
# mounts as files at /run/secrets/cloudbroker/ via Pydantic secrets_dir.
#
# Reference them in values.yaml:
#   existingSecret: cloudbroker-secrets
#   ingestor:
#     existingSecret: cloudbroker-ingest-secrets
---
# App secrets: database credentials + API auth
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbroker-secrets
  namespace: cloudbroker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudbroker-secrets
    creationPolicy: Owner
  data:
    # Database (required)
    - secretKey: database_url
      remoteRef:
        key: <bitwarden-secret-id-for-database-url>
    - secretKey: database_url_sync
      remoteRef:
        key: <bitwarden-secret-id-for-database-url-sync>
    # API authentication (optional in dev, required in prod)
    - secretKey: api_key
      remoteRef:
        key: <bitwarden-secret-id-for-api-key>
---
# Ingestion secrets: provider API keys
# Only include secrets for providers you want to ingest.
# Public API providers (Azure, AWS on-demand, OVH, Scaleway) don't need secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbroker-ingest-secrets
  namespace: cloudbroker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudbroker-ingest-secrets
    creationPolicy: Owner
  data:
    # Hetzner Cloud (required for Hetzner ingestion)
    - secretKey: hetzner_api_token
      remoteRef:
        key: <bitwarden-secret-id>
    # DigitalOcean
    - secretKey: digitalocean_api_token
      remoteRef:
        key: <bitwarden-secret-id>
    # UpCloud (token OR username+password)
    - secretKey: upcloud_api_token
      remoteRef:
        key: <bitwarden-secret-id>
    # Seeweb
    - secretKey: seeweb_api_token
      remoteRef:
        key: <bitwarden-secret-id>
    # AWS (only needed for spot pricing; on-demand uses public API)
    - secretKey: aws_access_key_id
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: aws_secret_access_key
      remoteRef:
        key: <bitwarden-secret-id>
    # GCP (project ID; auth via Workload Identity or SA key)
    - secretKey: google_cloud_project
      remoteRef:
        key: <bitwarden-secret-id>
    # IBM Cloud
    - secretKey: ibmcloud_api_key
      remoteRef:
        key: <bitwarden-secret-id>
    # Sustainability APIs
    - secretKey: entsoe_token
      remoteRef:
        key: <bitwarden-secret-id>
    - secretKey: eia_api_key
      remoteRef:
        key: <bitwarden-secret-id>
