# OIDC (Google) override - merge with coder-values.yaml when CODER_OIDC_CLIENT_ID is set.
# Creates coder-oidc secret from CODER_OIDC_* env vars before deploy.
# Google Cloud: add redirect URI https://<CODER_ACCESS_URL>/api/v2/users/oidc/callback
coder:
  env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
      value: "false"
    - name: CODER_ACCESS_URL
      value: "${CODER_ACCESS_URL}"
    # OIDC Google
    - name: CODER_OIDC_ISSUER_URL
      value: "https://accounts.google.com"
    - name: CODER_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: coder-oidc
          key: client_id
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-oidc
          key: client_secret
    - name: CODER_OIDC_EMAIL_DOMAIN
      value: "${CODER_OIDC_EMAIL_DOMAIN}"
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email"
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: "Sign in with Google"
    - name: CODER_OIDC_ICON_URL
      value: "/icon/google.svg"
    - name: CODER_OIDC_AUTH_URL_PARAMS
      value: '{"access_type": "offline", "prompt": "consent"}'
