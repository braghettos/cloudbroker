# Sustainability config: ENTSO-E bidding zones, UK/EIA region codes, and manual overrides.
#
# Data sources (all free):
#   ENTSO-E: free EU real-time grid data — register at https://transparency.entsoe.eu
#   UK Carbon Intensity API: free, no auth — https://api.carbonintensity.org.uk
#   EIA OpenData: free US grid data — register at https://www.eia.gov/opendata/
#   Static fallback: Ember Climate yearly country averages (embedded in sustainability_service.py)
#
# ENTSO-E EIC codes:
#   AT=10YAT-APG------L, BE=10YBE----------2, BG=10YCA-BULGARIA-R, CH=10YCH-SWISSGRID-E,
#   CZ=10YCZ-CEPS-----N, DE=10Y1001A1001A83F, DK-DK1=10YDK-1--------W, DK-DK2=10YDK-2--------M,
#   EE=10Y1001A1001A39I, ES=10YES-REE------0, FI=10YFI-1--------U, FR=10YFR-RTE------C,
#   GR=10YGR-HTSO-----Y, HR=10YHR-HEP------M, HU=10YHU-MAVIR----U, IE=10YIE-1001A00010,
#   IT=10YIT-GRTN-----B, LT=10YLT-1001A0008Q, LU=10YLU-CEGEDEL-NQ, LV=10YLV-1001A00074,
#   NL=10YNL----------L, NO=10YNO-0--------C, PL=10YPL-AREA-----S, PT=10YPT-REN------W,
#   RO=10YRO-TEL------P, SE=10YSE-1--------K, SI=10YSI-ELES-----O, SK=10YSK-SEPS-----K,
#   GB=10YGB----------A (UK, real-time via UK Carbon Intensity API is preferred)

