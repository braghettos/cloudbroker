# One-off Job to create the first Coder admin user (non-interactive)
# Runs after Coder is deployed and DB schema is initialized.
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-create-admin
  namespace: coder
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-admin
          image: ghcr.io/coder/coder:v2.31.2
          imagePullPolicy: IfNotPresent
          command: ["coder", "server", "create-admin-user"]
          env:
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-db-url
                  key: url
            - name: CODER_USERNAME
              value: "${CODER_USERNAME}"
            - name: CODER_EMAIL
              value: "${CODER_EMAIL}"
            - name: CODER_PASSWORD
              value: "${CODER_PASSWORD}"
